<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Mesmo bloco anti-flash das outras páginas. -->
<script>
(function () {
  try {
    if (localStorage.getItem("isabella-idioma") === "en") {
      document.documentElement.lang = "en";
      document.documentElement.setAttribute("data-i18n-pendente", "");
      setTimeout(function () {
        document.documentElement.removeAttribute("data-i18n-pendente");
      }, 1200);
    }
  } catch (e) {}
})();
</script>
<style>html[data-i18n-pendente] body { visibility: hidden; }</style>

<title>Página não encontrada | Isabella de Luna</title>
<meta name="description" content="A página que você procura não existe ou mudou de endereço.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#9E2027">

<link rel="icon" href="/assets/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=13">

<style>
  /* Todos os caminhos aqui saem da raiz: o erro pode acontecer em
     qualquer profundidade de URL, e caminho relativo quebraria. */
  .erro {
    display: flex;
    align-items: center;
    min-height: 100svh;
    padding-block: calc(var(--altura-header) + 3rem) 4rem;
    background: var(--vermelho);
    color: var(--creme);
    text-align: center;
  }
  .erro__codigo {
    font-family: var(--serif);
    font-size: clamp(4.5rem, 14vw, 9rem);
    line-height: 1;
    letter-spacing: -.02em;
    opacity: .32;
  }
  .erro__titulo {
    margin-top: .5rem;
    font-family: var(--serif);
    font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.75rem);
    line-height: 1.15;
  }
  .erro__texto {
    margin: 1.125rem auto 0;
    max-width: 44ch;
    font-weight: 300;
    line-height: 1.6;
    color: var(--tinta-clara);
  }
  .erro__acoes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-top: 2.25rem;
  }
</style>
</head>

<body data-i18n-titulo="meta.titulo404" data-i18n-descricao="meta.descricao404">
<a class="pular" href="#conteudo" data-i18n="geral.pular">Pular para o conteúdo</a>

<header class="cabecalho">
  <div class="cabecalho__interno">
    <a class="marca" href="/" aria-label="Isabella de Luna, Psicóloga — ir para o início"
       data-i18n-attr="aria-label:marca.aria">
      <span class="marca__simbolo">
        <img class="marca__creme" src="/assets/coracao-creme.png" alt="" width="832" height="1072">
        <img class="marca__vermelho" src="/assets/coracao-vermelho.png" alt="" width="832" height="1072">
      </span>
      <span class="marca__texto">
        <span class="marca__nome">Isabella de Luna</span>
        <span class="marca__papel" data-i18n="marca.papel">Psicóloga</span>
      </span>
    </a>

    <div class="idioma" role="group" aria-label="Selecionar idioma"
         data-i18n-attr="aria-label:idioma.aria">
      <button type="button" class="idioma__opcao idioma__opcao--ativo" data-idioma="pt"
              aria-pressed="true" lang="pt-BR">PT</button>
      <span class="idioma__sep" aria-hidden="true">|</span>
      <button type="button" class="idioma__opcao" data-idioma="en"
              aria-pressed="false" lang="en">EN</button>
    </div>
  </div>
</header>

<main class="erro" id="conteudo">
  <div class="textura textura--creme" aria-hidden="true"></div>

  <div class="interno">
    <p class="erro__codigo" aria-hidden="true">404</p>
    <h1 class="erro__titulo" data-i18n="erro404.titulo">Esta página não existe.</h1>
    <p class="erro__texto" data-i18n="erro404.texto">
      O endereço pode ter mudado, ou o link que te trouxe até aqui pode estar
      incompleto. Nada se perdeu — é só voltar.
    </p>

    <div class="erro__acoes">
      <a class="botao botao--claro" href="/">
        <span class="botao__texto" data-i18n-html="erro404.inicio">Voltar ao início <span class="seta" aria-hidden="true">→</span></span>
      </a>
      <a class="botao botao--zap" data-wa href="/#contato">
        <svg class="icone-zap" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#zap"/></svg>
        <span class="botao__texto" data-i18n-html="erro404.falar">Falar pelo WhatsApp <span class="seta" aria-hidden="true">→</span></span>
      </a>
    </div>
  </div>
</main>
